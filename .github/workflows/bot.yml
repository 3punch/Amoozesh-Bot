name: Run Telegram Bot 24/7

# ربات کاملاً داخل GitHub Actions اجرا می‌شود:
#   نصب Ollama → مدل Qwen → اجرای ربات → چرخش خودکار قبل از سقف ۶ ساعته
# هیچ چیزی لازم نیست روی سیستم خودت اجرا شود.
#
# دو حالت پاسخ:
#   • سریع (همیشه): پاسخ از داده، زیر یک ثانیه.
#   • مدل (انتخابی): دکمه‌ی زیر پاسخ یا /deep؛ مدل متن کامل را می‌خواند (۲ تا ۴ دقیقه).
#
# cron هر ۵ ساعت یک run در صف می‌گذارد؛ با concurrency (بدون cancel) همیشه
# دقیقاً یک نمونه در حال اجراست و نمونه‌ی بعدی بلافاصله جایش را می‌گیرد.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

# فقط یک نمونه هم‌زمان؛ نمونه‌ی بعدی در صف می‌ماند (بدون قطع‌شدن نمونه‌ی فعال)
concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # سقف Actions برای هر job = ۳۶۰ دقیقه
    env:
      # Qwen2.5:7b: فارسی بهتر از Gemma، بدون حالت استدلال. مقایسه: docs/model-benchmark.md
      MODEL_NAME: qwen2.5:7b
      # "0" = پاسخ فوری از داده‌های قطعی (بدون جمع‌بندی خودکار مدل).
      MODEL_SUMMARY: "0"
      # "1" = دکمه‌ی «🧠 تحلیل با مدل» زیر پاسخ + دستور /deep فعال باشد.
      # مدل فقط وقتی صدا زده می‌شود که کاربر خودش بخواهد؛ پاسخ سریع همان اول می‌آید.
      DEEP_MODE: "1"
      THINK: "0"
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: 6h
      OLLAMA_NUM_PARALLEL: "1"
      NUM_CTX: "3072"
      MAX_TOKENS: "120"
      MAX_CONTEXT_CHARS: "4000"
      BOT_RUN_MINUTES: "320"      # هر نمونه ۵ ساعت و ۲۰ دقیقه
      BOT_JOB_MINUTES: "335"      # کل job حداکثر ۵ ساعت و ۳۵ دقیقه

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # وزن‌های مدل در کش Actions می‌مانند؛ فقط وقتی کش خالی/منقضی شده باشد
      # دانلود انجام می‌شود. (کش ۷ روز بدون استفاده یا با پر شدن ۱۰ گیگ پاک می‌شود،
      # ولی این ربات هر ~۵ ساعت اجرا می‌شود و کش داغ می‌ماند.)
      - name: Resolve model cache key
        if: env.MODEL_SUMMARY == '1' || env.DEEP_MODE == '1'
        id: model_key
        run: |
          # «:» در نام مدل را برای کلید کش ساده می‌کنیم: qwen2.5:7b → qwen2-5-7b
          key=$(echo "$MODEL_NAME" | tr ':.@/' '----')
          echo "key=ollama-$key" >> "$GITHUB_OUTPUT"
          echo "کلید کش مدل: ollama-$key"

      - name: Restore model from cache
        if: env.MODEL_SUMMARY == '1' || env.DEEP_MODE == '1'
        id: model_cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ${{ steps.model_key.outputs.key }}-v3
          restore-keys: |
            ${{ steps.model_key.outputs.key }}-
            ollama-

      - name: Install Ollama
        if: env.MODEL_SUMMARY == '1' || env.DEEP_MODE == '1'
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama and make sure the model is present
        if: env.MODEL_SUMMARY == '1' || env.DEEP_MODE == '1'
        continue-on-error: true
        env:
          CACHE_HIT: ${{ steps.model_cache.outputs.cache-hit }}
        run: |
          set -u
          command -v ollama >/dev/null || { echo "::warning::Ollama نصب نشد."; exit 0; }

          mkdir -p ~/.ollama
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "$OLLAMA_HOST/api/tags" > /dev/null && break
            sleep 2
          done
          if ! curl -fsS "$OLLAMA_HOST/api/tags" > /dev/null; then
            echo "::warning::سرویس Ollama بالا نیامد؛ ربات در حالت سریع اجرا می‌شود."
            tail -20 /tmp/ollama.log || true
            exit 0
          fi
          echo "Ollama is up"

          if ollama list | awk '{print $1}' | grep -qx "$MODEL_NAME"; then
            echo "✅ مدل «$MODEL_NAME» از کش موجود است؛ دانلودی لازم نیست (cache-hit=$CACHE_HIT)."
          else
            echo "⬇️ مدل در کش نبود (cache-hit=$CACHE_HIT)؛ دانلود یک‌باره شروع می‌شود…"
            started=$(date +%s)
            ollama pull "$MODEL_NAME" || {
              echo "::warning::دانلود مدل ناموفق بود؛ ربات در حالت سریع اجرا می‌شود."
              exit 0
            }
            echo "دانلود در $(( $(date +%s) - started )) ثانیه تمام شد."
          fi
          ollama list

          # بارگذاری در حافظه تا اولین تحلیل کاربر منتظر بارگذاری نماند
          curl -fsS "$OLLAMA_HOST/api/generate" \
            -d "{\"model\":\"$MODEL_NAME\",\"prompt\":\"سلام\",\"stream\":false,\"options\":{\"num_predict\":8}}" \
            > /dev/null && echo "مدل در حافظه بارگذاری شد." || true

      - name: Report model availability
        if: always() && (env.MODEL_SUMMARY == '1' || env.DEEP_MODE == '1')
        env:
          CACHE_HIT: ${{ steps.model_cache.outputs.cache-hit }}
        run: |
          if curl -fsS "$OLLAMA_HOST/api/tags" 2>/dev/null | grep -q "$MODEL_NAME"; then
            echo "✅ حالت مدل آماده است (cache-hit=$CACHE_HIT)."
          else
            echo "::warning::مدل در دسترس نیست ⇒ ربات فقط در حالت سریع کار می‌کند."
          fi

      - name: Run tests
        run: python tests/test_offline.py

      - name: Check token secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::error::Secret با نام TELEGRAM_BOT_TOKEN تنظیم نشده است."
            exit 1
          fi

      - name: Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHECK_UPDATES: "1"
        run: bash scripts/run_bot.sh

      - name: Show Ollama log
        if: always() && (env.MODEL_SUMMARY == '1' || env.DEEP_MODE == '1')
        run: tail -50 /tmp/ollama.log || true

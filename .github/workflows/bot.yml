name: Run Telegram Bot (local model)

on:
  push:
    branches: [ main, arena/66e173f0-amoozesh-bot ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# از اجرای همزمان دو نمونه جلوگیری می‌کند (تلگرام اجازه‌ی دو polling همزمان نمی‌دهد)
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODEL_NAME: gemma3:4b
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: 6h
      NUM_CTX: "8192"
      MAX_CONTEXT_CHARS: "9000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- مدل: کش کردن وزن‌ها تا هر اجرا دوباره ۳ گیگ دانلود نشود
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.MODEL_NAME }}
          restore-keys: |
            ollama-

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server
        run: |
          mkdir -p ~/.ollama
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$OLLAMA_HOST/api/tags" > /dev/null; then
              echo "Ollama is up"; exit 0
            fi
            sleep 2
          done
          echo "Ollama did not start"; tail -50 /tmp/ollama.log; exit 1

      - name: Pull model
        run: |
          ollama pull "$MODEL_NAME"
          ollama list
          # بارگذاری در RAM تا اولین پاسخ کاربر معطل نماند
          curl -fsS "$OLLAMA_HOST/api/generate" \
            -d "{\"model\":\"$MODEL_NAME\",\"prompt\":\"سلام\",\"stream\":false,\"options\":{\"num_predict\":8}}" \
            > /dev/null

      - name: Run tests
        run: python tests/test_offline.py

      - name: Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python EntekhabVahedBot.py

      - name: Show Ollama log on failure
        if: failure()
        run: tail -100 /tmp/ollama.log

name: Deep Mode Check

# دیدن خروجی واقعی مدل در حالت «تحلیل با مدل»، بدون تلگرام.
# Actions → Deep Mode Check → Run workflow؛ نتیجه به‌صورت یک Issue ثبت می‌شود
# تا خواندنش راحت باشد (لاگ Actions سخت‌تر خوانده می‌شود).

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'نام مدل در Ollama'
        required: false
        default: 'qwen2.5:7b'
      question:
        description: 'پرسش (خالی = سه پرسش نمونه)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_NAME: ${{ inputs.model || 'qwen2.5:7b' }}
      OLLAMA_HOST: http://127.0.0.1:11434
      THINK: "0"
      DEEP_NUM_CTX: "8192"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.MODEL_NAME }}-v3
          restore-keys: |
            ollama-

      - name: Install and start Ollama
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "$OLLAMA_HOST/api/tags" > /dev/null && break
            sleep 2
          done
          if ollama list | awk '{print $1}' | grep -qx "$MODEL_NAME"; then
            echo "✅ مدل از کش موجود است؛ دانلودی لازم نیست."
          else
            echo "⬇️ مدل در کش نبود؛ دانلود…"
            ollama pull "$MODEL_NAME"
          fi
          ollama list

      - name: Run deep analysis
        env:
          QUESTION: ${{ inputs.question || '' }}
        run: |
          set -u
          mkdir -p reports
          report=reports/deep-report.md
          {
            echo "## خروجی واقعی حالت «تحلیل با مدل»"
            echo
            echo "- مدل: \`$MODEL_NAME\`"
            echo "- کامیت: \`${GITHUB_SHA:0:7}\`"
            echo "- زمان: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
          } > "$report"

          if [ -z "${QUESTION// }" ]; then
            questions=(
              "غلامیان یا تهرانیان؟"
              "استاد آذر ابوالقاسمی چطور استادی هستن"
              "استاد ایزدیخواه چطوره؟"
            )
          else
            questions=("$QUESTION")
          fi

          for q in "${questions[@]}"; do
            echo "### $q" >> "$report"
            echo '```' >> "$report"
            python ask.py --deep "$q" >> "$report" 2>&1 || echo "(خطا)" >> "$report"
            echo '```' >> "$report"
            echo >> "$report"
          done
          cat "$report"

      - name: Publish report as issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/body.json
          import json
          body = open("reports/deep-report.md", encoding="utf-8").read()
          print(json.dumps({"title": "گزارش حالت تحلیل با مدل (خودکار)", "body": body[:60000]}))
          PY
          gh api repos/${{ github.repository }}/issues \
            --method POST --input /tmp/body.json --jq '"issue #\(.number): \(.html_url)"'

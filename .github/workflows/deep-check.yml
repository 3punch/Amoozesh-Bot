name: Verify Deep Mode

# گردش‌کار موقت برای دیدن خروجی واقعی مدل در حالت «تحلیل با مدل».
# نتیجه به‌صورت یک Issue ثبت می‌شود تا از بیرون هم قابل خواندن باشد.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deep-check.yml'
      - 'deep.py'
      - 'prompts.py'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_NAME: qwen2.5:7b
      OLLAMA_HOST: http://127.0.0.1:11434
      THINK: "0"
      DEEP_NUM_CTX: "8192"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.MODEL_NAME }}-v2
          restore-keys: |
            ollama-models-

      - name: Install and start Ollama
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "$OLLAMA_HOST/api/tags" > /dev/null && break
            sleep 2
          done
          ollama pull "$MODEL_NAME"
          ollama list

      - name: Run deep analysis
        run: |
          set -u
          mkdir -p reports
          report=reports/deep-report.md
          {
            echo "## خروجی واقعی حالت «تحلیل با مدل»"
            echo
            echo "- مدل: \`$MODEL_NAME\`"
            echo "- کامیت: \`${GITHUB_SHA:0:7}\`"
            echo "- زمان: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
          } > "$report"

          questions=(
            "غلامیان یا تهرانیان؟"
            "استاد آذر ابوالقاسمی چطور استادی هستن"
            "استاد ایزدیخواه چطوره؟"
          )

          for q in "${questions[@]}"; do
            echo "### $q" >> "$report"
            echo '```' >> "$report"
            python ask.py --deep "$q" >> "$report" 2>&1 || echo "(خطا)" >> "$report"
            echo '```' >> "$report"
            echo >> "$report"
          done
          cat "$report"

      - name: Publish report as issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/body.json
          import json
          body = open("reports/deep-report.md", encoding="utf-8").read()
          print(json.dumps({"title": "گزارش حالت تحلیل با مدل (خودکار)", "body": body[:60000]}))
          PY
          gh api repos/${{ github.repository }}/issues \
            --method POST --input /tmp/body.json --jq '"issue #\(.number): \(.html_url)"'

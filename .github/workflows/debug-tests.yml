name: Debug Offline Tests

# موقت: برای دیدن خروجی تست‌ها وقتی لاگ Actions در دسترس نیست.
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MODEL_NAME: qwen2.5:7b
      MODEL_SUMMARY: "0"
      DEEP_MODE: "1"
      API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      API_MODEL: qwen/qwen2.5-72b-instruct
      API_BASE_URL: https://openrouter.ai/api/v1
      QUOTA_PERSIST: "1"
      QUOTA_STATE_BRANCH: bot-state
      THINK: "0"
      OLLAMA_HOST: http://127.0.0.1:11434
      NUM_CTX: "3072"
      MAX_TOKENS: "120"
      MAX_CONTEXT_CHARS: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          set +e
          python tests/test_offline.py > /tmp/tests.txt 2>&1
          code=$?
          echo "exit=$code"
          tail -60 /tmp/tests.txt
          {
            echo "### نتیجه‌ی تست آفلاین (exit=$code)"
            echo "شاخه: ${GITHUB_REF_NAME} · کامیت: ${GITHUB_SHA:0:7} · پایتون: $(python -V 2>&1)"
            echo '```'
            tail -80 /tmp/tests.txt
            echo '```'
          } > /tmp/body.md
          gh issue create --title "debug: offline tests exit=$code (${GITHUB_SHA:0:7})" \
            --body-file /tmp/body.md --label "" || gh issue create --title "debug: offline tests exit=$code (${GITHUB_SHA:0:7})" --body-file /tmp/body.md
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}

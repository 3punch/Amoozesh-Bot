# ==============================================================================
# Amoozesh-Bot — docker-compose.yml (اجرای یک‌کلک در هر محیط)
# ==============================================================================
services:
  ollama:
    image: ollama/ollama:latest
    container_name: amoozesh-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build: .
    container_name: amoozesh-bot
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.state:/app/.state
    restart: unless-stopped
    command: python EntekhabVahedBot.py

volumes:
  ollama_data:
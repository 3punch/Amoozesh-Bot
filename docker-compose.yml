services:
  ollama:
    image: ollama/ollama:latest
    container_name: amoozesh-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build: .
    container_name: amoozesh-bot
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATA_DIR: /app
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - bot_state:/app/.state
    restart: unless-stopped
    command: ["python", "EntekhabVahedBot.py"]

volumes:
  ollama_data:
  bot_state:
